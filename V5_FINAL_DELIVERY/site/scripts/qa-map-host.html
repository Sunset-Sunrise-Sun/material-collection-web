<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>地图宿主集成验收视口</title><style>body{margin:0;background:#e9e9e4;font:13px system-ui}header{padding:8px 12px;display:flex;gap:12px;align-items:center}button{padding:7px 12px}iframe{display:block;border:0;background:#f7f6f2;width:390px;height:844px;margin:0 12px 12px}output{font-size:12px}</style><header><strong>本地宿主集成验收</strong><button data-width="390">390px</button><button data-width="1280">1280px</button><output id="result">等待页面</output></header><iframe id="host" src="./#s-4-1" title="V3研究成果预览，390像素视口"></iframe><script>
const frame=document.querySelector('iframe'),output=document.querySelector('output');let events={select:0,metric:0,source:null,adcode:null};
document.querySelectorAll('button[data-width]').forEach(b=>b.onclick=()=>{frame.style.width=b.dataset.width+'px';frame.title='V3研究成果预览，'+b.dataset.width+'像素视口';});
frame.onload=()=>{const d=frame.contentDocument;output.textContent='宿主已加载';d.addEventListener('gzmap:select',e=>{events.select++;events.source=e.detail.source;events.adcode=e.detail.adcode;output.textContent=JSON.stringify(events);output.dataset.select=events.select;output.dataset.source=events.source;output.dataset.adcode=events.adcode||'';});d.addEventListener('gzmap:metricchange',()=>{events.metric++;output.textContent=JSON.stringify(events);});};
</script></html>
